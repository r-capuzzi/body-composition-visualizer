<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <meta
      name="description"
      content="Project how your body composition changes over a fitness plan."
    />
    <title>Body Composition Visualizer</title>

    <!-- Link previews (LinkedIn, Slack, iMessage, X...). Scrapers don't run
         JS, so this static HTML is all they see. og:url/og:image must be
         absolute URLs. og-image.png is a 1200x630 headless-Chrome screenshot
         of the app itself; regenerate it if the UI changes noticeably. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Body Composition Visualizer" />
    <meta property="og:title" content="Body Composition Visualizer" />
    <meta
      property="og:description"
      content="Project how your weight, body fat and muscle change over a diet and training plan, with a 3D avatar that morphs week by week."
    />
    <meta property="og:url" content="https://body-composition-visualizer.vercel.app/" />
    <meta property="og:image" content="https://body-composition-visualizer.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The app: a body-stats form beside a 3D avatar and a week-by-week projection timeline."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
